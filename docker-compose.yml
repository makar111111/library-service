name: library-service

x-app: &app
  build: .
  image: library-service:local
  env_file: .env
  environment:
    POSTGRES_HOST: db
    CELERY_BROKER_URL: redis://redis:6379/0
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - library-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - library-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    <<: *app
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "127.0.0.1:${APP_PORT:-8018}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/books/', timeout=5)"
      interval: 5s
      timeout: 6s
      start_period: 20s
      retries: 12

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule=/tmp/library-celerybeat
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  library-db:
  library-redis:
