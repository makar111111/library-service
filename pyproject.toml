[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '/(\.venv|\.local)/'

[tool.coverage.run]
branch = true
source = ["users", "books", "borrowings", "notifications"]
omit = ["*/migrations/*", "*/tests/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60
